services:
  ami-talk-bot:
    build: .
    container_name: ami-talk-bot
    restart: unless-stopped
    networks:
      - nextcloud-network
    env_file: env/.env.dev.user
    volumes:
      - ami-data:/app/data
      - nextcloud_www:/var/www/html:ro

# Attach to the stock Nextcloud network so Nextcloud can reach us by name
networks:
  nextcloud-network:
    external: true
    name: nextcloud-network

# Persists approved-room approvals across container rebuilds
volumes:
  ami-data:
  nextcloud_www:
    external: true
