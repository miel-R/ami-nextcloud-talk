services:
  ami-talk-bot:
    build: .
    container_name: ami-talk-bot
    restart: unless-stopped
    networks:
      - nextcloud-aio
    env_file: env/.env.dev.user
    volumes:
      - ami-data:/app/data
      - nextcloud-aio_nextcloud:/var/www/html:ro

# Attach to the stock Nextcloud network so Nextcloud can reach us by name
networks:
  nextcloud-aio:
    external: true

# Persists approved-room approvals across container rebuilds
volumes:
  ami-data:
  nextcloud-aio_nextcloud:
    external: true
